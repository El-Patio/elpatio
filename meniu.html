<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Patio Suceava | Meniu Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #d32f2f; --wood: #3e2723; --sand: #fdfaf6; --leaf: #2e7d32; --dark: #1a1a1a; }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--sand); color: var(--wood); display: flex; flex-direction: column; min-height: 100vh; }

        /* HEADER & NAV */
        header { background: white; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 2000; }
        .nav-links { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; white-space: nowrap; scrollbar-width: none; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-links a { text-decoration: none; color: var(--wood); font-size: 0.85rem; font-weight: 600; padding: 5px 12px; border-radius: 15px; border: 1px solid #eee; transition: 0.3s; }
        .nav-links a:hover { background: var(--accent); color: white; }
        
        .btn-index { background: #eee; color: var(--wood); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; text-decoration: none; margin-right: 15px; font-size: 0.9rem; }

        /* HERO SECTION */
        .hero {
            height: 400px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center;
        }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 4.5rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }

        /* AUTH MODAL */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 4000; }
        .auth-modal { background: white; padding: 35px; width: 90%; max-width: 400px; border-radius: 15px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: #999; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .auth-modal input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }

        /* CONTENT GRID - MODIFICAT PENTRU 3 PE ORIZONTALA */
        .container { max-width: 1200px; margin: auto; padding: 20px; flex: 1; }
        .category-header { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 50px 0 25px; color: var(--accent); border-left: 5px solid var(--leaf); padding-left: 15px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* FORȚEAZĂ 3 COLOANE */
            gap: 25px; 
            margin-bottom: 40px;
        }

        /* AJUSTARE PENTRU ECRANE MICI (TABLETE/TELEFOANE) */
        @media (max-width: 992px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

        .item-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        .item-card img { width: 100%; height: 200px; object-fit: cover; }
        .item-content { padding: 20px; flex-grow: 1; }
        .item-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: flex-start; }
        
        .info-panel { display: none; padding: 15px; background: #fdf6f6; font-size: 0.85rem; border-top: 1px dashed #ddd; color: #555; line-height: 1.5; }
        .actions { display: flex; gap: 8px; margin-top: 15px; }
        .info-btn { flex: 1; background: #f0f0f0; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .order-btn { flex: 2; background: var(--leaf); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 0.8rem; }
        .order-btn.added { background: var(--wood); }

        /* CART */
        #cart-sidebar { position: fixed; right: -400px; top: 0; width: 350px; height: 100%; background: white; box-shadow: -5px 0 20px rgba(0,0,0,0.2); z-index: 3000; transition: 0.4s; display: flex; flex-direction: column; }
        #cart-sidebar.active { right: 0; }
        .cart-float { position: fixed; bottom: 80px; right: 25px; background: var(--accent); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2500; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .badge { position: absolute; top: 0; right: 0; background: var(--leaf); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border: 2px solid white; }

        /* FOOTER */
        footer { background: var(--dark); color: white; text-align: center; padding: 25px 0; font-size: 0.9rem; letter-spacing: 1px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <span style="float:right; cursor:pointer; font-size: 1.5rem;" onclick="toggleAuth()">×</span>
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Logare</div>
                <div class="auth-tab" id="tabRegister" onclick="switchAuth('register')">Înregistrare</div>
            </div>
            <div id="authForm">
                <input type="text" placeholder="Nume Complet" id="userName" style="display:none;">
                <input type="email" placeholder="Email" id="userEmail">
                <input type="password" placeholder="Parolă" id="userPass">
                <button class="order-btn" style="width:100%; margin-top:15px; background:var(--accent); font-size: 1rem;" onclick="processAuth()">Confirmă</button>
            </div>
        </div>
    </div>

    <header>
        <div style="display: flex; align-items: center;">
            <a href="index.html" class="btn-index">Inapoi</a>
            <div style="font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--wood);">EL PATIO</div>
        </div>
        <nav class="nav-links">
            <a href="#signature">Signature</a>
            <a href="#aperitive">Aperitive</a>
            <a href="#supe">Supe</a>
            <a href="#principale">Principale</a>
            <a href="#vegan">Vegan</a>
            <a href="#kids">Kids</a>
            <a href="#bauturi">Băuturi</a>
        </nav>
        <div>
            <span id="welcomeMsg" style="margin-right: 10px; font-weight: 600; display: none; color: var(--leaf);"></span>
            <button class="btn-account" style="background: var(--wood); color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer;" id="accBtn" onclick="toggleAuth()">Cont</button>
        </div>
    </header>

    <div class="hero">
        <h1>EL PATIO</h1>
        <p>Savoarea Modernistă în Suceava</p>
    </div>

    <div id="cart-sidebar">
        <div style="padding: 20px; background: var(--wood); color: white; display: flex; justify-content: space-between;">
            <h3>Comanda Mea</h3><span onclick="toggleCart()" style="cursor:pointer; font-size: 1.5rem;">×</span>
        </div>
        <div id="cartList" style="flex-grow: 1; padding: 20px; overflow-y: auto;"></div>
        <div style="padding: 20px; border-top: 1px solid #eee;">
            <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom: 15px;">
                <span>Total:</span> <span id="cartTotal">0 RON</span>
            </div>
            <button class="order-btn" style="width:100%; background: var(--accent); font-size: 1rem;" onclick="finishOrder()">Finalizează Comanda</button>
        </div>
    </div>

    <div class="cart-float" onclick="toggleCart()">🛒<div class="badge" id="cartCount">0</div></div>

    <div class="container" id="menu-box"></div>

    <footer>
        © 2026 El Patio Suceava. Savoarea Modernistă.
    </footer>

    <script>
        const menuItems = [
            // Toate cele 21 de preparate raman exact la fel ca anterior...
            { cat: "signature", catName: "Chef's Signature", name: "Pulpo la Parrilla", price: 89, img: "https://braseriaelcarbon.com/wp-content/uploads/2024/04/pulpo-a-la-parrilla-3.jpg", info: "Ingrediente: Caracatiță, cartofi dulci, chimichurri, sare afumată. | 350g | 420 kcal" },
            { cat: "signature", catName: "Chef's Signature", name: "Vită Mole", price: 78, img: "https://urbancowgirllife.com/wp-content/uploads/2022/05/Mexican-Grilled-Steaks-with-Mole-Butter-3.jpg", info: "Ingrediente: Antricot vită Angus, sos mole artizanal, cacao, chili. | 400g | 680 kcal" },
            { cat: "signature", catName: "Chef's Signature", name: "Mofongo Imperial", price: 65, img: "https://annainthekitchen.com/wp-content/uploads/2021/01/mofongo.jpg", info: "Ingrediente: Banane plantain zdrobite, creveți, usturoi, bacon. | 380g | 550 kcal" },
            
            { cat: "aperitive", catName: "Aperitive", name: "Guacamole Artisan", price: 34, img: "https://static.mega-image.ro/site/binaries/_ht_1588072271000/lg/content/gallery/image-components/mega-image-romania-ro/articole-inspiratie/guacamole/comp_00000o0t.png?imwidth=680", info: "Ingrediente: Avocado proaspăt, lime, ceapă roșie, tortilla chips. | 250g | 310 kcal" },
            { cat: "aperitive", catName: "Aperitive", name: "Tostones Cubanos", price: 32, img: "https://static01.nyt.com/images/2019/10/03/dining/kwr-tostones/kwr-tostones-videoSixteenByNineJumbo1600.jpg", info: "Ingrediente: Banane verzi prăjite, sare, mujo de usturoi. | 200g | 280 kcal" },
            { cat: "aperitive", catName: "Aperitive", name: "Nachos Locos", price: 38, img: "https://images.unsplash.com/photo-1513456852971-30c0b8199d4d", info: "Ingrediente: Tortilla, sos de brânză, jalapenos, salsa fresca. | 300g | 480 kcal" },

            { cat: "supe", catName: "Supe & Ciorbe", name: "Sancocho", price: 48, img: "https://gypsyplate.com/wp-content/uploads/2022/10/puerto-rican-sancocho_square.jpg", info: "Ingrediente: Vită, yuca, porumb, dovleac, rădăcinoase. | 400ml | 450 kcal" },
            { cat: "supe", catName: "Supe & Ciorbe", name: "Supa Tortilla", price: 35, img: "https://images.unsplash.com/photo-1588566565463-180a5b2090d2", info: "Ingrediente: Roșii coapte, tortilla crocante, chili, avocado. | 350ml | 310 kcal" },
            { cat: "supe", catName: "Supe & Ciorbe", name: "Cremă Porumb", price: 32, img: "https://www.culinar.ro/uploads/modules/news/0/2015/12/7/26611/fdb_1449504024_supacremadeporumb%281%29.jpg", info: "Ingrediente: Porumb dulce, smântână, semințe dovleac, chili. | 350ml | 290 kcal" },

            { cat: "principale", catName: "Feluri Principale", name: "Tacos Al Pastor", price: 42, img: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b", info: "Ingrediente: Porc marinat, ananas, ceapă, coriandru, tortilla. | 300g | 510 kcal" },
            { cat: "principale", catName: "Feluri Principale", name: "Burrito Jefe", price: 48, img: "https://res.cloudinary.com/grubhub/image/upload/w_339,q_80,fl_lossy,dpr_2.0,c_fill,f_auto,h_156/tmrvkfqpwheugi1lggy5", info: "Ingrediente: Vită Angus, orez, fasole neagră, guacamole. | 450g | 890 kcal" },
            { cat: "principale", catName: "Feluri Principale", name: "Quesadilla Birria", price: 44, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh0tzyWFB3y8P4m-Ccdi7irf2yzGo72szakA&s", info: "Ingrediente: Vită gătită lent, brânză, ceapă, consomé inclus. | 350g | 720 kcal" },

            { cat: "vegan", catName: "Opțiuni Vegane", name: "Tacos Hibiscus", price: 36, img: "https://theveganplanetkitchen.com/wp-content/uploads/2022/09/IMG_8180-1024x720.jpg", info: "Ingrediente: Flori de hibiscus, avocado, ceapă murată. | 280g | 290 kcal" },
            { cat: "vegan", catName: "Opțiuni Vegane", name: "Burrito Quinoa", price: 39, img: "https://www.thatorganicmom.com/wp-content/uploads/2022/06/black-bean-quinoa-burrito.jpeg", info: "Ingrediente: Quinoa, tofu afumat, fasole, legume fresh. | 400g | 620 kcal" },
            { cat: "vegan", catName: "Opțiuni Vegane", name: "Bowl Tropical", price: 35, img: "https://walnuts.org/wp-content/uploads/2025/04/recipe-Smoothie-Bowl-CloseUp.jpg", info: "Ingrediente: Mango, edamame, cartof dulce, sos agave. | 400g | 380 kcal" },

            { cat: "kids", catName: "Meniu Kids", name: "Mini Quesadilla", price: 28, img: "https://img.taste.com.au/bBODSRhW/taste/2016/11/mini-mexican-quesadillas-74686-1.jpeg", info: "Ingrediente: Tortilla moale, mix de brânză nepicant. | 200g | 310 kcal" },
            { cat: "kids", catName: "Meniu Kids", name: "Pui Crispy", price: 32, img: "https://blog.boromirmarket.ro/wp-content/uploads/2022/08/pui-crispy-800x840.jpg", info: "Ingrediente: Fâșii piept de pui, crustă porumb, cartofi. | 250g | 420 kcal" },
            { cat: "kids", catName: "Meniu Kids", name: "Tacos Junior", price: 25, img: "https://static01.nyt.com/images/2021/07/22/dining/jr-mushroom-chicharron-tacos/jr-mushroom-chicharron-tacos-videoSixteenByNineJumbo1600-v2.jpg", info: "Ingrediente: Pui la grătar, porumb dulce, brânză moale. | 150g | 240 kcal" },

            { cat: "bauturi", catName: "Băuturi", name: "Limonadă Mango", price: 24, img: "https://dietasimpla.wordpress.com/wp-content/uploads/2019/01/limonada_de_mango-2.jpg", info: "Ingrediente: Mango fresh, suc lime, mentă, apă plată. | 400ml | 120 kcal" },
            { cat: "bauturi", catName: "Băuturi", name: "Churros Shake", price: 28, img: "https://thecrumbykitchen.com/wp-content/uploads/2015/07/Twist-and-Shout-Shake-2.jpg", info: "Ingrediente: Înghețată vanilie, lapte, scorțișoară. | 350ml | 380 kcal" },
            { cat: "bauturi", catName: "Băuturi", name: "Fresh Portocale", price: 22, img: "https://www.spendwithpennies.com/wp-content/uploads/2016/04/Spend-With-Pennies-Orange-Margarita-21.jpg", info: "Ingrediente: Portocale 100% proaspăt stoarse. | 300ml | 140 kcal" }
        ];

        let currentCat = "";
        const menuBox = document.getElementById('menu-box');
        menuItems.forEach(item => {
            if(item.catName !== currentCat) {
                currentCat = item.catName;
                menuBox.innerHTML += `<h2 class="category-header" id="${item.cat}">${currentCat}</h2><div class="grid" id="grid-${item.cat}"></div>`;
            }
            const card = `
                <div class="item-card">
                    <img src="${item.img}">
                    <div class="item-content">
                        <div class="item-title"><span>${item.name}</span> <span style="color:var(--leaf); font-weight:700;">${item.price} RON</span></div>
                        <div class="actions">
                            <button class="info-btn" onclick="toggleInfo(this)">ℹ️ Info</button>
                            <button class="order-btn" onclick="addToCart(this, '${item.name}', ${item.price})">Adaugă</button>
                        </div>
                    </div>
                    <div class="info-panel">${item.info}</div>
                </div>`;
            document.getElementById(`grid-${item.cat}`).innerHTML += card;
        });

        // TOATE FUNCTIILE JS RAMAN LA FEL...
        let user = null; let cart = [];
        function toggleAuth() { document.getElementById('authOverlay').style.display = (document.getElementById('authOverlay').style.display === 'flex') ? 'none' : 'flex'; }
        function switchAuth(mode) {
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
            document.getElementById('userName').style.display = mode === 'register' ? 'block' : 'none';
        }
        function processAuth() {
            const email = document.getElementById('userEmail').value;
            if(!email) return alert("Date incomplete!");
            user = email.split('@')[0];
            document.getElementById('welcomeMsg').innerText = "Salut, " + user + "!";
            document.getElementById('welcomeMsg').style.display = "inline";
            document.getElementById('accBtn').innerText = "Logout";
            document.getElementById('accBtn').onclick = () => location.reload();
            toggleAuth();
        }
        function toggleInfo(btn) {
            const panel = btn.closest('.item-card').querySelector('.info-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }
        function addToCart(btn, name, price) {
            cart.push({name, price});
            btn.innerText = "Adăugat! ✅"; btn.classList.add('added');
            setTimeout(() => { btn.innerText = "Adaugă"; btn.classList.remove('added'); }, 800);
            updateCart();
        }
        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('cartTotal').innerText = total + " RON";
            document.getElementById('cartList').innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;"><span>${i.name}</span><b>${i.price} RON</b></div>`).join('');
        }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }
        function finishOrder() {
            if(!user) { alert("Te rugăm să te loghezi!"); toggleAuth(); return; }
            if(cart.length === 0) return alert("Coșul e gol!");
            alert("Comandă trimisă!"); cart = []; updateCart(); toggleCart();
        }
    </script>
</body>
</html>
